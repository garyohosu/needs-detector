[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "needs-detector"
version = "0.1.0"
description = "CLI tool for continuous needs validation"
authors = [
    { name = "Hantani", email = "hantani@example.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.1",
    "pydantic>=2.7.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0"
]

[project.scripts]
needs-detector = "needs_detector.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/needs_detector"]
